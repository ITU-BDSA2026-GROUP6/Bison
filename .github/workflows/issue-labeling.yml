name: Issue Labeling

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Add label Bug
        if: contains(github.event.issue.title,'[BUG]')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: bug

      - name: Add label Feature
        if: contains(github.event.issue.title,'[FEATURE]')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: feature

      - name: Add label Bug
        if: contains(github.event.issue.title,'[TEST]')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: testing

      - name: Add label Documentation
        if: contains(github.event.issue.title,'[DOC]')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: documentation
